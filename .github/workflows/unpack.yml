name: Unpack ChessMate project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

            - name: Extract project
        run: |
          mkdir extracted
          unzip -q ChessMate-cloud-build.zip -d extracted
          rm -rf extracted/.github
          cp -R extracted/. .
          rm -rf extracted
          rm ChessMate-cloud-build.zip

      - name: Save project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract ChessMate project"
          git push
